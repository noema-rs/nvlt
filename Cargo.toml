[workspace]
resolver = "2"
members = ["core", "passwords", "envs", "files", "totp", "ssh", "cli"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
age = "=0.11.1"
age-core = "=0.11.0"
argon2 = "=0.5.3"
rand = "=0.8.5"
secrecy = "=0.8.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=1.0.69"
totp-rs = { version = "=5.6.0", features = ["gen_secret", "otpauth"] }
zeroize = "=1.8.1"
hex = "=0.4.3"
hkdf = "=0.12.4"
sha2 = "=0.10.8"
tar = "=0.4.44"
chrono = { version = "=0.4.40", features = ["serde"] }
clap = { version = "=4.5.37", features = ["derive"] }
directories = "=5.0.1"
miette = { version = "=7.6.0", features = ["fancy"] }
owo-colors = "=4.2.0"
rpassword = "=7.3.1"
toml = "=0.8.23"
keyring = "=3.6.2"
base64 = "=0.22.1"
blake3 = "=1.5.5"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
image = "=0.25.6"
nix = { version = "=0.29.0", features = ["resource"] }
qrcode = "=0.14.1"
rqrr = "=0.9.2"
